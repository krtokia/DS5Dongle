# Builds the firmware with the Wi-Fi UDP wake feature turned on.
#
# Deliberately separate from build-firmware.yml rather than a matrix entry in
# it: this is a fork-local feature, and keeping it in its own file means the
# upstream workflows can be updated by merge without conflicting here.

name: wifi-wake

on:
  push:
    branches:
      - feat/wifi-udp-wake
  workflow_dispatch:

env:
  # Pinned to match the upstream CI. pico-sdk 2.3.0 bundles a TinyUSB older
  # than the one this project's tusb_config.h expects, and building against the
  # bundled one fails on a TUD_AUDIO_EP_SIZE arity mismatch.
  PICO_SDK_REF: "2.3.0"
  TINYUSB_REF: 2d56dc533e45e4e91b15e93fdab5e22e964f328d
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  ARM_TOOLCHAIN_VERSION: 15.2.rel1
  ARM_TOOLCHAIN_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.2.rel1/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
  ARM_TOOLCHAIN_PATH: ${{ github.workspace }}/arm-toolchain

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build .uf2 (ENABLE_WIFI_WAKE=ON)
            artifact: ds5-bridge-wifi-wake
            cmake_args: -DENABLE_WIFI_WAKE=ON
          # Diagnostic build. ENABLE_SERIAL routes printf to a USB CDC port, so
          # logs need no UART adapter - and it also leaves the 1 s watchdog
          # disabled, which makes this an A/B test for whether a watchdog reset
          # is what breaks USB enumeration.
          - name: Build .uf2 (diagnostic, USB serial log)
            artifact: ds5-bridge-wifi-wake-debug
            cmake_args: -DENABLE_WIFI_WAKE=ON -DENABLE_SERIAL=ON -DWAKE_DEBUG=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libusb + pkg-config are for picotool, which the SDK builds to
          # produce the .uf2 for RP2350 targets.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 build-essential libusb-1.0-0-dev pkg-config

      - name: Cache ARM toolchain
        id: cache-arm-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Download ARM toolchain
        if: steps.cache-arm-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_PATH"
          curl -fsSL "$ARM_TOOLCHAIN_URL" | tar -xJ -C "$ARM_TOOLCHAIN_PATH" --strip-components=1

      - name: Add ARM toolchain to PATH
        run: echo "$ARM_TOOLCHAIN_PATH/bin" >> "$GITHUB_PATH"

      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.PICO_SDK_PATH }}
          key: ${{ runner.os }}-pico-sdk-${{ env.PICO_SDK_REF }}-tinyusb-${{ env.TINYUSB_REF }}

      - name: Download Pico SDK
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --recursive
          git -C "$PICO_SDK_PATH/lib/tinyusb" fetch --depth 1 origin "$TINYUSB_REF"
          git -C "$PICO_SDK_PATH/lib/tinyusb" checkout --detach FETCH_HEAD

      # Credentials are NOT compiled in. The .uf2 published below is a public
      # build artifact and anything compiled into it is readable with `strings`.
      # tools/uf2-wifi-config.html writes them into the image afterwards, in the
      # browser, so this artifact carries no secrets.
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$PICO_SDK_PATH" \
            ${{ matrix.cmake_args }} \
            -DVERSION="wifi-wake-${GITHUB_SHA::7}"
          cmake --build build --target ds5-bridge

      - name: Report size
        run: |
          arm-none-eabi-size -A build/ds5-bridge.elf | head -20

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/ds5-bridge.uf2 "dist/${{ matrix.artifact }}.uf2"
          cp build/ds5-bridge.elf "dist/${{ matrix.artifact }}.elf"
          # Shipped with the firmware so the .uf2 and the tool that configures
          # it always come from the same commit.
          cp tools/uf2-wifi-config.html dist/
          ls -l dist

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
